# src-tauri/Cargo.toml
[package]
name = "KraaPro"
version = "3.0.0"
description = "Kraa Pro Application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
tauri = { version = "1.6", features = ["path-all", "shell-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]